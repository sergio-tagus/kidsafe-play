name: Build signed Android App Bundle (SafeTube Kids)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      # Este script ya existe en tu repo (scripts/build-capacitor.mjs):
      # hace vite build + genera index.html estático + npx cap sync
      - name: Build web + sync Capacitor
        run: bun run cap:build

      - name: Configurar Java (necesario para Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decodificar el keystore desde Secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Compilar el Android App Bundle firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Subir el .aab como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: safetube-kids-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Eliminar el keystore del runner
        if: always()
        run: rm -f android/app/release.keystore
